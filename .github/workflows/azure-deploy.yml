name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_name:
        description: App Service to deploy
        required: true
        default: PP-MCP-Server
        type: choice
        options:
          - PP-MCP-Server
          - PP-App-Serv
      source_ref:
        description: Optional commit or ref to deploy (defaults to the triggering commit)
        required: false
        default: ""
        type: string

concurrency:
  group: azure-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          # library.liveproxima.org is bound to PP-MCP-Server.
          app-name: ${{ inputs.app_name || 'PP-MCP-Server' }}
          startup-command: 'bash startup.sh'
