name: Deploy Image Library or Restore Pete MCP

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        default: deploy-image-library
        type: choice
        options:
          - deploy-image-library
          - restore-pete-mcp
      pete_deployment_id:
        description: Required only for restore-pete-mcp; full Azure Kudu deployment ID
        required: false
        default: ""
        type: string

concurrency:
  group: image-library-${{ inputs.operation || 'deploy-image-library' }}
  cancel-in-progress: true

jobs:
  deploy-image-library:
    if: github.event_name == 'push' || inputs.operation == 'deploy-image-library'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Confirm authoritative target
        run: |
          echo "Image Library production target: PP-App-Serv"
          echo "Do not deploy Image Library code to PP-MCP-Server."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Revert run-from-package (caused a stuck deploy / 503)
        run: |
          az webapp config appsettings set \
            --resource-group PP-Resources \
            --name PP-App-Serv \
            --settings WEBSITE_RUN_FROM_PACKAGE=0 \
            --output none
          # Give the app-settings-triggered restart time to settle before
          # the next step pushes a new zip — deploying immediately after
          # an appsettings change is the suspected cause of the last hang.
          sleep 30

      - name: Deploy to Image Library App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: PP-App-Serv
          startup-command: 'bash startup.sh'

  restore-pete-mcp:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'restore-pete-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate Pete restore request
        env:
          PETE_DEPLOYMENT_ID: ${{ inputs.pete_deployment_id }}
        run: |
          test "${PETE_DEPLOYMENT_ID}" = "4d21efc3-6f6c-4acb-b0e9-c6c2daf0440a" || {
            echo "This guarded restore only permits the verified Pete MCP package 4d21efc3-6f6c-4acb-b0e9-c6c2daf0440a." >&2
            exit 1
          }

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Temporarily enable Pete MCP SCM publishing authentication
        run: |
          set -euo pipefail
          az rest --method PUT \
            --uri "https://management.azure.com/subscriptions/9528fb58-4fa4-43f8-9940-e5c3e1f1903f/resourceGroups/PP-Resources/providers/Microsoft.Web/sites/PP-MCP-Server/basicPublishingCredentialsPolicies/scm?api-version=2022-09-01" \
            --body '{"properties":{"allow":true}}'

      - name: Restore verified Pete MCP package
        run: |
          set -euo pipefail
          PUBLISHING_USER=$(az webapp deployment list-publishing-credentials --resource-group PP-Resources --name PP-MCP-Server --query publishingUserName -o tsv)
          PUBLISHING_PASSWORD=$(az webapp deployment list-publishing-credentials --resource-group PP-Resources --name PP-MCP-Server --query publishingPassword -o tsv)

          # Enabling SCM Basic auth is asynchronous. Wait until Kudu accepts the
          # newly enabled publishing credentials before changing any package files.
          SCM_READY=false
          for _attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              --user "${PUBLISHING_USER}:${PUBLISHING_PASSWORD}" \
              --output /dev/null \
              "https://pp-mcp-server.scm.azurewebsites.net/api/settings"; then
              SCM_READY=true
              break
            fi
            sleep 5
          done
          test "${SCM_READY}" = true || {
            echo "SCM publishing authentication did not become available in time." >&2
            exit 1
          }

          # Confirm the archived OneDeploy package exists before switching the active pointer.
          curl --fail-with-body --silent --show-error \
            --user "${PUBLISHING_USER}:${PUBLISHING_PASSWORD}" \
            --range 0-0 \
            --output /dev/null \
            "https://pp-mcp-server.scm.azurewebsites.net/api/vfs/data/SitePackages/20260825061243.zip"

          # This is the exact package named in the verified deployment log for 4d21efc.
          curl --fail-with-body --silent --show-error \
            --user "${PUBLISHING_USER}:${PUBLISHING_PASSWORD}" \
            --request PUT \
            --header 'Content-Type: text/plain' \
            --header 'If-Match: *' \
            --data-binary '20260825061243.zip' \
            "https://pp-mcp-server.scm.azurewebsites.net/api/vfs/data/SitePackages/packagename.txt"

          # Match OneDeploy's package activation behavior.
          curl --fail-with-body --silent --show-error \
            --user "${PUBLISHING_USER}:${PUBLISHING_PASSWORD}" \
            --request PUT \
            --header 'Content-Type: text/plain' \
            --header 'If-Match: *' \
            --data-binary '' \
            "https://pp-mcp-server.scm.azurewebsites.net/api/vfs/site/wwwroot/restartTrigger.txt"

      - name: Disable Pete MCP SCM publishing authentication
        if: always()
        run: |
          set -euo pipefail
          az rest --method PUT \
            --uri "https://management.azure.com/subscriptions/9528fb58-4fa4-43f8-9940-e5c3e1f1903f/resourceGroups/PP-Resources/providers/Microsoft.Web/sites/PP-MCP-Server/basicPublishingCredentialsPolicies/scm?api-version=2022-09-01" \
            --body '{"properties":{"allow":false}}'
